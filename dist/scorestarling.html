<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接转谱服务</title>
<style>body{margin:0;background:#f1efed;color:#352f3b;font:16px system-ui,-apple-system,sans-serif;min-height:100dvh;display:grid;place-items:center}main{width:min(560px,calc(100% - 64px));padding:28px;border:1px solid #fff9;border-radius:28px;background:#ffffff80;box-shadow:0 18px 60px #30203015;backdrop-filter:blur(24px)}h1{font-size:26px}p{line-height:1.7;color:#645c69}button,a{font:inherit;color:#76536e}button{padding:12px 18px;background:#ffffffb0;border:1px solid #ffffff;border-radius:18px;cursor:pointer}input{display:block;box-sizing:border-box;width:100%;padding:14px;margin:12px 0;border:1px solid #ccc5;border-radius:14px;font:inherit}progress{width:100%;accent-color:#76536e}button:disabled{opacity:.5}#confirm[hidden]{display:none}</style></head>
<body><main><a href="/">返回工作区</a><h1>SUPERTANG AI智能转谱</h1><p id="status" role="status">正在检查连接…</p><button id="connect">连接账号</button><form id="form"><input id="title" placeholder="曲名" required><input id="url" type="url" placeholder="歌曲、视频或音频链接" required><button id="submit">转谱并加入曲库</button></form><progress id="progress" max="100" value="0"></progress><button id="confirm" hidden></button><p>转录完成后自动保存到云曲库。导出如需积分，会先显示费用，确认后继续。</p></main><script type="module" src="/scorestarling-ui.js"></script></body></html>
